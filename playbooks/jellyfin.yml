---
# Jellyfin's state on the [nixos_arr] machines, as code: the admin user, the
# libraries and the settings come from inventory/group_vars/nixos_arr/jellyfin.yml.
# Run from nixos_playbooks/, after arr_nix.yml:
#   ansible-playbook config/jellyfin.yml -e app_action=<action>
#
#   configure  create the admin user on the first start, add the missing
#              libraries and paths, set the listed settings
#   backup     save the live settings in the app state store (appstate/,
#              jellyfin.yml, same format as the inventory) and show their
#              differences from the inventory, i.e. changes made in Jellyfin's UI
#   default    erase Jellyfin's config and database (not the media) and start
#              it empty, with the admin user only; needs -e app_wipe=true
#
# Secrets in Bitwarden: jellyfin_admin_password, generated on the first run.

- name: Manage Jellyfin's state
  hosts: nixos_arr
  gather_facts: false

  vars:
    nixos_ssh_private_key: "{{ bitwarden_secrets[ssh_key_name ~ '_private_key'] }}"

  pre_tasks:
    - name: jellyfin.yml | Check the action
      ansible.builtin.assert:
        that:
          - app_action | default('') in ['default', 'configure', 'backup']
        fail_msg: "Pass -e app_action=default|configure|backup."
        quiet: true
      tags: always

    - name: jellyfin.yml | Create the login password in Bitwarden
      ansible.builtin.include_role:
        name: bitwarden
        apply:
          tags: always
      vars:
        bitwarden_action: put
        bitwarden_secret_name: jellyfin_admin_password
        bitwarden_secret_content: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=24) }}"
        bitwarden_secret_note: "Jellyfin admin user ({{ jellyfin_admin_username }}) on [nixos_arr], created by moicpl.app_config.jellyfin"
        bitwarden_secret_id_file: "{{ ansible_inventory_sources | first }}/group_vars/nixos_arr/jellyfin.yml"
      when: jellyfin_admin_password_bws_id is not defined
      tags: always

    - name: jellyfin.yml | Get the secrets from Bitwarden
      ansible.builtin.include_role:
        name: bitwarden
        apply:
          tags: always
      vars:
        bitwarden_action: get
        bitwarden_secret_name: "{{ item }}"
      loop:
        - "{{ ssh_key_name }}_private_key"
        - jellyfin_admin_password
      tags: always

    - name: jellyfin.yml | Connect to the host
      ansible.builtin.include_role:
        name: moicpl.nixos.nixos
        tasks_from: connect.yml
        apply:
          tags: always
      tags: always

  tasks:
    - name: jellyfin.yml | Manage Jellyfin's state
      ansible.builtin.include_role:
        name: moicpl.app_config.jellyfin
      vars:
        jellyfin_action: "{{ app_action }}"
        jellyfin_wipe: "{{ app_wipe | default(false) | bool }}"
        jellyfin_admin_password: "{{ bitwarden_secrets.jellyfin_admin_password }}"
        jellyfin_store_dir: "{{ appstate_dir }}/{{ inventory_hostname }}/jellyfin"
