---
# Nextcloud's state on the [nixos_arr] machines, as code: the admin user, the
# settings and the apps come from inventory/group_vars/nixos_arr/nextcloud.yml.
# Run from nixos_playbooks/, after arr_nix.yml:
#   ansible-playbook config/nextcloud.yml -e app_action=<action>
#
#   configure  install Nextcloud on the first start, keep the admin password,
#              set the listed settings, install, enable and disable the apps
#   backup     save the database and config.php in the app state store
#              (appstate/<host>/nextcloud/, encrypted with sops), and the live
#              settings (nextcloud.yml, same format as the inventory); show
#              their differences from the inventory, i.e. changes made in
#              Nextcloud's UI. configure restores the database on a new install.
#   user       create a user (name from -e app_user=<name>, or asked), not an
#              admin, with its password from Bitwarden (nextcloud_user_<name>_password,
#              asked or generated when missing); an existing one is left alone
#   default    erase Nextcloud's config and database, set the users' files
#              aside and install it again, with the admin user only; needs
#              -e app_wipe=true
#
# Secrets in Bitwarden: nextcloud_admin_password, generated on the first run;
# nextcloud_db_password, generated by arr_nix.yml; appstate_age_key
# (appstate_key.yml), for the store's encrypted files.

- name: Manage Nextcloud's state
  hosts: nixos_arr
  gather_facts: false

  vars:
    nixos_ssh_private_key: "{{ bitwarden_secrets[ssh_key_name ~ '_private_key'] }}"

  pre_tasks:
    - name: nextcloud.yml | Check the action
      ansible.builtin.assert:
        that:
          - app_action | default('') in ['default', 'configure', 'backup', 'user']
        fail_msg: "Pass -e app_action=default|configure|backup|user."
        quiet: true
      tags: always

    - name: nextcloud.yml | Create the login password in Bitwarden
      ansible.builtin.include_role:
        name: bitwarden
        apply:
          tags: always
      vars:
        bitwarden_action: put
        bitwarden_secret_name: nextcloud_admin_password
        bitwarden_secret_content: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=24) }}"
        bitwarden_secret_note: "Nextcloud admin user ({{ nextcloud_admin_username }}) on [nixos_arr], created by moicpl.app_config.nextcloud"
        bitwarden_secret_id_file: "{{ ansible_inventory_sources | first }}/group_vars/nixos_arr/nextcloud.yml"
      when: nextcloud_admin_password_bws_id is not defined
      tags: always

    # app_action=user: the user's login, its password in Bitwarden
    - name: nextcloud.yml | Name the user to create and get its password
      ansible.builtin.include_tasks:
        file: tasks/app_user.yml
        apply:
          tags: always
      vars:
        app_user_app: nextcloud
        app_user_label: username
        app_user_pattern: "^[A-Za-z0-9 _.@'-]+$"
        app_user_id_file: "{{ ansible_inventory_sources | first }}/group_vars/nixos_arr/nextcloud.yml"
      when: app_action == 'user'
      tags: always

    - name: nextcloud.yml | Get the secrets from Bitwarden
      ansible.builtin.include_role:
        name: bitwarden
        apply:
          tags: always
      vars:
        bitwarden_action: get
        bitwarden_secret_name: "{{ item }}"
      loop:
        - "{{ ssh_key_name }}_private_key"
        - nextcloud_admin_password
        - nextcloud_db_password
        - appstate_age_key
      tags: always

    - name: nextcloud.yml | Connect to the host
      ansible.builtin.include_role:
        name: moicpl.nixos.nixos
        tasks_from: connect.yml
        apply:
          tags: always
      tags: always

  tasks:
    - name: nextcloud.yml | Manage Nextcloud's state
      ansible.builtin.include_role:
        name: moicpl.app_config.nextcloud
      vars:
        nextcloud_action: "{{ app_action }}"
        nextcloud_user_login: "{{ app_user_login | default('') }}"
        nextcloud_user_password: "{{ bitwarden_secrets[app_user_secret] if app_action == 'user' else '' }}"
        nextcloud_wipe: "{{ app_wipe | default(false) | bool }}"
        nextcloud_admin_password: "{{ bitwarden_secrets.nextcloud_admin_password }}"
        nextcloud_db_password: "{{ bitwarden_secrets.nextcloud_db_password }}"
        nextcloud_store_dir: "{{ appstate_dir }}/{{ inventory_hostname }}/nextcloud"
        nextcloud_age_recipient: "{{ appstate_age_public_key }}"
        nextcloud_age_key: "{{ bitwarden_secrets.appstate_age_key }}"
