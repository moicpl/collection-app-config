---
# Nextcloud is stopped. Its config, its app store apps and its database; not
# its code (the image's) nor the users' files (on /data).
- name: snapshot.yml | Create the snapshot directory
  ansible.builtin.file:
    path: "{{ nextcloud_snapshot_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: snapshot.yml | Save the current state
  ansible.builtin.command:
    argv:
      - tar
      - --create
      - --gzip
      - --file={{ nextcloud_snapshot_dir }}/{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}.tar.gz
      - --directory=/
      - --ignore-failed-read
      - "{{ nextcloud_html_dir | relpath('/') }}/config"
      - "{{ nextcloud_html_dir | relpath('/') }}/custom_apps"
      - "{{ nextcloud_html_dir | relpath('/') }}/themes"
      - "{{ nextcloud_db_dir | relpath('/') }}"
  changed_when: true

- name: snapshot.yml | Find the snapshots
  ansible.builtin.find:
    paths: "{{ nextcloud_snapshot_dir }}"
    patterns: "*.tar.gz"
  register: nextcloud_snapshots_found

- name: snapshot.yml | Remove the oldest snapshots
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ (nextcloud_snapshots_found.files | sort(attribute='mtime', reverse=true))[nextcloud_snapshot_keep | int :] }}"
  loop_control:
    label: "{{ item.path }}"
