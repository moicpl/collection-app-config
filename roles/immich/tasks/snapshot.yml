---
# Immich is stopped. Its database: the photos are on /data, untouched.
- name: snapshot.yml | Create the snapshot directory
  ansible.builtin.file:
    path: "{{ immich_snapshot_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: snapshot.yml | Save the current state
  ansible.builtin.command:
    argv:
      - tar
      - --create
      - --gzip
      - --file={{ immich_snapshot_dir }}/{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}.tar.gz
      - --directory=/
      - --ignore-failed-read
      - "{{ immich_db_dir | relpath('/') }}"
  changed_when: true

- name: snapshot.yml | Find the snapshots
  ansible.builtin.find:
    paths: "{{ immich_snapshot_dir }}"
    patterns: "*.tar.gz"
  register: immich_snapshots_found

- name: snapshot.yml | Remove the oldest snapshots
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ (immich_snapshots_found.files | sort(attribute='mtime', reverse=true))[immich_snapshot_keep | int :] }}"
  loop_control:
    label: "{{ item.path }}"
