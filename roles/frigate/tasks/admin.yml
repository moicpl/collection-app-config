---
# Straight in the database (files/admin_password.py): Frigate has no setting for
# it. Retried while Frigate creates its database after a (re)start.
- name: admin.yml | Set the admin password
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - --interactive
      - "{{ frigate_container }}"
      - python3
      - -c
      - "{{ lookup('ansible.builtin.file', 'admin_password.py') }}"
    stdin: "{{ frigate_admin_password }}"
    stdin_add_newline: false
  register: frigate_admin
  changed_when: frigate_admin.stdout | trim == 'changed'
  until: frigate_admin.rc == 0
  retries: 30
  delay: 10
  no_log: true
