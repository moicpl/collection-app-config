---
# Frigate is stopped. Everything but the recordings and the model cache, which
# Frigate rebuilds.
- name: snapshot.yml | Create the snapshot directory
  ansible.builtin.file:
    path: "{{ frigate_snapshot_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: snapshot.yml | Save the current state
  ansible.builtin.command:
    argv:
      - tar
      - --create
      - --gzip
      - --file={{ frigate_snapshot_dir }}/{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}.tar.gz
      - --directory=/
      - --exclude={{ frigate_config_dir | relpath('/') }}/model_cache
      - --ignore-failed-read
      - "{{ frigate_config_dir | relpath('/') }}"
      - "{{ frigate_secrets_dir | relpath('/') }}"
  changed_when: true

- name: snapshot.yml | Find the snapshots
  ansible.builtin.find:
    paths: "{{ frigate_snapshot_dir }}"
    patterns: "*.tar.gz"
  register: frigate_snapshots_found

- name: snapshot.yml | Remove the oldest snapshots
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ (frigate_snapshots_found.files | sort(attribute='mtime', reverse=true))[frigate_snapshot_keep | int :] }}"
  loop_control:
    label: "{{ item.path }}"
