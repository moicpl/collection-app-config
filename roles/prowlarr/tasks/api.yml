---
# Prowlarr answers once started; its API key is in config.xml, which it writes
# on its first start.
- name: api.yml | Wait for Prowlarr
  ansible.builtin.uri:
    url: "{{ prowlarr_url }}/ping"
  register: prowlarr_ping
  until: prowlarr_ping.status == 200
  retries: 30
  delay: 5
  check_mode: false

- name: api.yml | Read Prowlarr's config.xml
  ansible.builtin.slurp:
    src: "{{ prowlarr_config_dir }}/config.xml"
  register: prowlarr_config_xml

- name: api.yml | Use Prowlarr's API key
  ansible.builtin.set_fact:
    prowlarr_api_key: "{{ prowlarr_config_xml.content | b64decode | regex_search('<ApiKey>(\\w+)</ApiKey>', '\\1') | first }}"
  no_log: true
