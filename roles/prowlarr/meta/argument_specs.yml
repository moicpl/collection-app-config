---
argument_specs:
  main:
    short_description: Manage the state of a Prowlarr container
    description:
      - configure sets the login and adds or updates the apps Prowlarr syncs its indexers to.
      - backup saves the live login settings and apps as YAML and shows their drift from the variables.
      - default erases Prowlarr's state (needs prowlarr_wipe) and starts it empty with the login.
    options:
      prowlarr_action:
        type: str
        required: true
        choices: [default, configure, backup]
        description: What the run does.
      prowlarr_wipe:
        type: bool
        default: false
        description: Allow default to erase the state.
      prowlarr_admin_username:
        type: str
        default: admin
        description: Login user.
      prowlarr_admin_password:
        type: str
        required: true
        no_log: true
        description: Password of the login user.
      prowlarr_authentication_required:
        type: str
        default: enabled
        choices: [enabled, disabledForLocalAddresses]
        description: Where the login is required.
      prowlarr_applications:
        type: list
        elements: dict
        default: []
        description: Apps Prowlarr syncs its indexers to, by name (see defaults/main.yml).
      prowlarr_application_sync_level:
        type: str
        default: fullSync
        choices: [disabled, addOnly, fullSync]
        description: Sync level of the apps that don't set sync_level.
      prowlarr_application_prowlarr_url:
        type: str
        default: http://prowlarr:9696
        description: How the apps reach Prowlarr (prowlarrUrl).
      prowlarr_store_dir:
        type: str
        required: true
        description: This host's prowlarr directory in the app state store, on the controller.
