---
argument_specs:
  main:
    short_description: Manage the state of a Radarr container
    description:
      - configure sets the login, adds the root folders and movies and sets the download clients from the variables.
      - backup saves the live settings as YAML and shows their drift from the variables.
      - default erases Radarr's state (needs radarr_wipe) and starts it empty with the login.
    options:
      radarr_action:
        type: str
        required: true
        choices: [default, configure, backup]
        description: What the run does.
      radarr_wipe:
        type: bool
        default: false
        description: Allow default to erase the state.
      radarr_admin_username:
        type: str
        default: admin
        description: Login user.
      radarr_admin_password:
        type: str
        required: true
        no_log: true
        description: Password of the login user.
      radarr_authentication_required:
        type: str
        default: enabled
        choices: [enabled, disabledForLocalAddresses]
        description: Where the login is required.
      radarr_root_folders:
        type: list
        elements: str
        default: []
        description: Root folders, as seen in the container.
      radarr_quality_profile:
        type: str
        default: HD-1080p
        description: Quality profile of the movies that don't name one.
      radarr_minimum_availability:
        type: str
        default: released
        choices: [announced, inCinemas, released]
        description: When a movie counts as available, for the movies that don't set it.
      radarr_movie_search:
        type: bool
        default: false
        description: Search for the movie when it is added.
      radarr_movies:
        type: list
        elements: dict
        default: []
        description: Movies, by TMDB ID (see defaults/main.yml).
      radarr_download_clients:
        type: list
        elements: dict
        default: []
        description: Download clients, by name (see defaults/main.yml).
      radarr_download_client_passwords:
        type: dict
        default: {}
        no_log: true
        description: Passwords of the download clients, by their password_secret.
      radarr_store_dir:
        type: str
        required: true
        description: This host's radarr directory in the app state store, on the controller.
