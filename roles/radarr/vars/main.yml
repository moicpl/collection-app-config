---
radarr_api_headers:
  X-Api-Key: "{{ radarr_api_key }}"

# The listed movies with their defaults, in the format backup saves (built as
# JSON: a template made of several parts gives a string)
radarr_movies_desired: "{{ radarr_movies_desired_json | from_json }}"
radarr_movies_desired_json: >-
  [{% for movie in radarr_movies | sort(attribute='tmdb_id') %}
  {{ {'title': movie.title | default(''),
      'tmdb_id': movie.tmdb_id | int,
      'quality_profile': movie.quality_profile | default(radarr_quality_profile),
      'root_folder': movie.root_folder | default(radarr_root_folders | first),
      'monitored': movie.monitored | default(true) | bool,
      'minimum_availability': movie.minimum_availability | default(radarr_minimum_availability)} | to_json }}{{ '' if loop.last else ',' }}
  {% endfor %}]

# Download clients as {name, implementation, enable, priority, fields}: fields
# complete (Radarr's defaults for those not given), without the empty ones and
# the passwords (masked by the API). The listed ones, and the live ones; they
# need radarr_download_client_schema and radarr_download_clients_api (the API's
# lists of templates and of clients).
radarr_download_clients_desired: "{{ radarr_download_clients_desired_json | from_json }}"
radarr_download_clients_desired_json: >-
  [{% for client in radarr_download_clients | sort(attribute='name') %}
  {% set schema = (radarr_download_client_schema | selectattr('implementation', 'equalto', client.implementation) | first).fields
                  | rejectattr('type', 'equalto', 'password') | selectattr('value', 'defined') | list %}
  {{ {'name': client.name,
      'implementation': client.implementation,
      'enable': client.enable | default(true) | bool,
      'priority': client.priority | default(1) | int,
      'fields': dict(schema | map(attribute='name') | zip(schema | map(attribute='value')))
                | combine(client.fields | default({})) | dict2items | rejectattr('value', 'none') | items2dict} | to_json }}{{ '' if loop.last else ',' }}
  {% endfor %}]
radarr_download_clients_state: "{{ radarr_download_clients_state_json | from_json }}"
radarr_download_clients_state_json: >-
  [{% for client in radarr_download_clients_api | sort(attribute='name') %}
  {% set fields = client.fields | rejectattr('type', 'equalto', 'password') | selectattr('value', 'defined') | list %}
  {{ {'name': client.name,
      'implementation': client.implementation,
      'enable': client.enable,
      'priority': client.priority,
      'fields': dict(fields | map(attribute='name') | zip(fields | map(attribute='value')))
                | dict2items | rejectattr('value', 'none') | items2dict} | to_json }}{{ '' if loop.last else ',' }}
  {% endfor %}]
