---
# Radarr answers once started; its API key is in config.xml, which it writes
# on its first start.
- name: api.yml | Wait for Radarr
  ansible.builtin.uri:
    url: "{{ radarr_url }}/ping"
  register: radarr_ping
  until: radarr_ping.status == 200
  retries: 30
  delay: 5
  check_mode: false

- name: api.yml | Read Radarr's config.xml
  ansible.builtin.slurp:
    src: "{{ radarr_config_dir }}/config.xml"
  register: radarr_config_xml

- name: api.yml | Use Radarr's API key
  ansible.builtin.set_fact:
    radarr_api_key: "{{ radarr_config_xml.content | b64decode | regex_search('<ApiKey>(\\w+)</ApiKey>', '\\1') | first }}"
  no_log: true
