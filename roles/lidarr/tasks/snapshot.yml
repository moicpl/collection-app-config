---
# Lidarr is stopped. Everything but the logs and the posters (MediaCover),
# which Lidarr downloads again.
- name: snapshot.yml | Create the snapshot directory
  ansible.builtin.file:
    path: "{{ lidarr_snapshot_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: snapshot.yml | Save the current state
  ansible.builtin.command:
    argv:
      - tar
      - --create
      - --gzip
      - --file={{ lidarr_snapshot_dir }}/{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}.tar.gz
      - --directory=/
      - --exclude={{ lidarr_config_dir | relpath('/') }}/MediaCover
      - --exclude={{ lidarr_config_dir | relpath('/') }}/logs
      - --ignore-failed-read
      - "{{ lidarr_config_dir | relpath('/') }}"
  changed_when: true

- name: snapshot.yml | Find the snapshots
  ansible.builtin.find:
    paths: "{{ lidarr_snapshot_dir }}"
    patterns: "*.tar.gz"
  register: lidarr_snapshots_found

- name: snapshot.yml | Remove the oldest snapshots
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ (lidarr_snapshots_found.files | sort(attribute='mtime', reverse=true))[lidarr_snapshot_keep | int :] }}"
  loop_control:
    label: "{{ item.path }}"
