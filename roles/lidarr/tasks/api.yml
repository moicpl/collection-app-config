---
# Lidarr answers once started; its API key is in config.xml, which it writes
# on its first start.
- name: api.yml | Wait for Lidarr
  ansible.builtin.uri:
    url: "{{ lidarr_url }}/ping"
  register: lidarr_ping
  until: lidarr_ping.status == 200
  retries: 30
  delay: 5
  check_mode: false

- name: api.yml | Read Lidarr's config.xml
  ansible.builtin.slurp:
    src: "{{ lidarr_config_dir }}/config.xml"
  register: lidarr_config_xml

- name: api.yml | Use Lidarr's API key
  ansible.builtin.set_fact:
    lidarr_api_key: "{{ lidarr_config_xml.content | b64decode | regex_search('<ApiKey>(\\w+)</ApiKey>', '\\1') | first }}"
  no_log: true
