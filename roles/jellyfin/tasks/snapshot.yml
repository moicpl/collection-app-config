---
# Jellyfin is stopped. Everything but the logs, the caches and the
# downloaded metadata (images...), which Jellyfin rebuilds with a scan.
- name: snapshot.yml | Create the snapshot directory
  ansible.builtin.file:
    path: "{{ jellyfin_snapshot_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: snapshot.yml | Save the current state
  ansible.builtin.command:
    argv:
      - tar
      - --create
      - --gzip
      - --file={{ jellyfin_snapshot_dir }}/{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}.tar.gz
      - --directory=/
      - --exclude={{ jellyfin_config_dir | relpath('/') }}/log
      - --exclude={{ jellyfin_config_dir | relpath('/') }}/cache
      - --exclude={{ jellyfin_config_dir | relpath('/') }}/data/metadata
      - --exclude={{ jellyfin_config_dir | relpath('/') }}/data/transcodes
      - --ignore-failed-read
      - "{{ jellyfin_config_dir | relpath('/') }}"
  changed_when: true

- name: snapshot.yml | Find the snapshots
  ansible.builtin.find:
    paths: "{{ jellyfin_snapshot_dir }}"
    patterns: "*.tar.gz"
  register: jellyfin_snapshots_found

- name: snapshot.yml | Remove the oldest snapshots
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ (jellyfin_snapshots_found.files | sort(attribute='mtime', reverse=true))[jellyfin_snapshot_keep | int :] }}"
  loop_control:
    label: "{{ item.path }}"
