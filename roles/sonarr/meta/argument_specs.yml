---
argument_specs:
  main:
    short_description: Manage the state of a Sonarr container
    description:
      - configure sets the login and adds the root folders and series from the variables.
      - backup saves the live settings as YAML and shows their drift from the variables.
      - default erases Sonarr's state (needs sonarr_wipe) and starts it empty with the login.
    options:
      sonarr_action:
        type: str
        required: true
        choices: [default, configure, backup]
        description: What the run does.
      sonarr_wipe:
        type: bool
        default: false
        description: Allow default to erase the state.
      sonarr_admin_username:
        type: str
        default: admin
        description: Login user.
      sonarr_admin_password:
        type: str
        required: true
        no_log: true
        description: Password of the login user.
      sonarr_authentication_required:
        type: str
        default: enabled
        choices: [enabled, disabledForLocalAddresses]
        description: Where the login is required.
      sonarr_root_folders:
        type: list
        elements: str
        default: []
        description: Root folders, as seen in the container.
      sonarr_quality_profile:
        type: str
        default: HD-1080p
        description: Quality profile of the series that don't name one.
      sonarr_series_monitor:
        type: str
        default: all
        description: Episodes monitored when a series is added.
      sonarr_series_search:
        type: bool
        default: false
        description: Search for the missing episodes when a series is added.
      sonarr_series:
        type: list
        elements: dict
        default: []
        description: Series, by TVDB ID (see defaults/main.yml).
      sonarr_download_clients:
        type: list
        elements: dict
        default: []
        description: Download clients, by name (see defaults/main.yml).
      sonarr_store_dir:
        type: str
        required: true
        description: This host's sonarr directory in the app state store, on the controller.
